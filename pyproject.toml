[dependency-groups]

dev = [
    "black>=26.5.1",
    "mypy>=2.3.1",
    "pandas-stubs>=3.0.5.260730",
    "ruff>=0.16.4",
]

[project]
name = "python-foundations"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.5",
    "typer>=0.27.2",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
